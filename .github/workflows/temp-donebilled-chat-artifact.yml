name: Temporary DoneBilled chat artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-donebilled-chat-artifact.yml"

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch verified DoneBilled APK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/Ant411/Peqiuddich/releases/download/donebilled-stage8-chat/DoneBilled-AU-Stage8-Test.apk"
          curl --fail --silent --show-error -L "$URL" -o DoneBilled-AU-Stage8-Test.apk
          test "$(stat -c%s DoneBilled-AU-Stage8-Test.apk)" = "3508663"
          echo "cf58eb168bcf45213e102c25b654b167243f49987224c46a189df3fcb4d2b42a  DoneBilled-AU-Stage8-Test.apk" | sha256sum -c -
          unzip -t DoneBilled-AU-Stage8-Test.apk >/dev/null
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoneBilled-AU-Stage8-Test
          path: DoneBilled-AU-Stage8-Test.apk
          retention-days: 1
          compression-level: 0
