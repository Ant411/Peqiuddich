name: DoneBilled Stage 9 chat attachment
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/donebilled-stage9-chat-attachment.yml"
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch verified Stage 9 APK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://tmpfiles.org/dl/wtAPnixQ1fMC/donebilled-au-stage9-navigation-test.apk"
          APK="DoneBilled-AU-Stage9-Navigation-Test.apk"
          curl --fail --silent --show-error -L "$URL" -o "$APK"
          ACTUAL_SIZE="$(stat -c%s "$APK")"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "ACTUAL_SIZE=$ACTUAL_SIZE"
          echo "ACTUAL_SHA=$ACTUAL_SHA"
          file "$APK"
          if [ "$ACTUAL_SIZE" = "3509175" ] && [ "$ACTUAL_SHA" = "ff9153759dd1cdb96ef8ec5289ee576e16ad03f3775ffe36c92998672d2b9b78" ]; then
            unzip -t "$APK" >/dev/null
          else
            head -c 200 "$APK" | xxd || true
            exit 1
          fi
      - name: Upload APK for ChatGPT
        uses: actions/upload-artifact@v4
        with:
          name: DoneBilled-AU-Stage9-Navigation-Test
          path: DoneBilled-AU-Stage9-Navigation-Test.apk
          retention-days: 1
          compression-level: 0
